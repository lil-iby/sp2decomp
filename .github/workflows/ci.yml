name: CI & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    name: Build & Test (Windows MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S port -B build `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DSP2PORT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Run tests
        working-directory: build
        run: ctest -C RelWithDebInfo --output-on-failure --timeout 60

      - name: Collect executables
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          New-Item -ItemType Directory -Force dist
          Get-ChildItem -Path build\RelWithDebInfo -Filter *.exe | Copy-Item -Destination dist\
        shell: pwsh

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: sp2port-windows-${{ github.ref_name }}
          path: dist\*.exe

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sp2port-windows-${{ github.ref_name }}
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
